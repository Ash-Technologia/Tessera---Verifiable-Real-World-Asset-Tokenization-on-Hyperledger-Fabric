    <ellipse cx="0" cy="0" rx="8" ry="12" transform="rotate(-15)"/>
    <ellipse cx="20" cy="-5" rx="7" ry="11" transform="rotate(10)"/>
    <ellipse cx="40" cy="5" rx="8" ry="12" transform="rotate(-5)"/>
