    <rect x="-10" y="50" width="20" height="15" fill="#EAF3FF" opacity="0.8" rx="2"/>
    <rect x="-10" y="80" width="20" height="15" fill="#EAF3FF" opacity="0.8" rx="2"/>
  </g>
  
