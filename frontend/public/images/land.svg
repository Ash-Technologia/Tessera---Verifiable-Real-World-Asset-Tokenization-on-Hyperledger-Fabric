<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="landGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16A36A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#15803D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1B32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EAF3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BCD8FC;stop-opacity:1" />
    </linearGradient>
    <pattern id="grassPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M4,8 Q2,4 4,0 Q6,4 4,8" fill="#16A36A" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="100" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.7;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Distant hills -->
  <path d="M0,100 Q100,60 200,80 Q300,60 400,90 L400,120 L0,120 Z" fill="#14532D" opacity="0.5"/>
  <path d="M0,110 Q150,70 300,90 Q400,75 400,110 L400,130 L0,130 Z" fill="#16A36A" opacity="0.4"/>
  
  <!-- Main land parcel -->
  <path d="M40,100 L40,180 Q40,190 50,190 L350,190 Q360,190 360,180 L360,100 Q360,85 340,75 L280,75 L260,55 Q255,50 245,50 L155,50 Q145,50 140,55 L120,75 L60,75 Q40,85 40,100 Z" fill="url(#landGradient)"/>
  
  <!-- Grass texture overlay -->
  <path d="M40,100 L40,180 Q40,190 50,190 L350,190 Q360,190 360,180 L360,100 Q360,85 340,75 L280,75 L260,55 Q255,50 245,50 L155,50 Q145,50 140,55 L120,75 L60,75 Q40,85 40,100 Z" fill="url(#grassPattern)"/>
  
  <!-- Boundary markers -->
  <g stroke="#FFFFFF" stroke-width="2" fill="#E64D5B">
    <circle cx="50" cy="100" r="6"/>
    <circle cx="350" cy="100" r="6"/>
    <circle cx="50" cy="180" r="6"/>
    <circle cx="350" cy="180" r="6"/>
    <circle cx="200" cy="55" r="6"/>
  </g>
  
  <!-- Survey grid lines -->
  <g stroke="#FFFFFF" stroke-width="0.5" opacity="0.2">
    <line x1="100" y1="100" x2="100" y2="180"/>
    <line x1="150" y1="100" x2="150" y2="180"/>
    <line x1="200" y1="100" x2="200" y2="180"/>
    <line x1="250" y1="100" x2="250" y2="180"/>
    <line x1="300" y1="100" x2="300" y2="180"/>
  </g>
  
  <!-- Building/structure outline -->
  <g>
    <rect x="180" y="55" width="40" height="45" fill="#142B4A" opacity="0.8" rx="2"/>
    <rect x="188" y="65" width="10" height="15" fill="#EAF3FF" opacity="0.6" rx="1"/>
    <rect x="202" y="65" width="10" height="15" fill="#EAF3FF" opacity="0.6" rx="1"/>
    <rect x="185" y="88" width="30" height="12" fill="#FEF3C7" opacity="0.8" rx="1"/>
  </g>
  
  <!-- TESSERA branding -->
  <text x="200" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" opacity="0.15">TESSERA</text>
</svg>