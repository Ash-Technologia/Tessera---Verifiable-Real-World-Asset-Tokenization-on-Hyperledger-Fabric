name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  backend:
    uses: ./.github/workflows/backend-ci.yml

  chaincode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: |
          if [ -f blockchain/chaincode/go.mod ]; then
            cd blockchain/chaincode && go mod download
          fi

      - name: Build chaincode
        run: |
          if [ -f blockchain/chaincode/go.mod ]; then
            cd blockchain/chaincode && go build ./...
          fi

      - name: Run chaincode tests
        run: |
          if [ -f blockchain/chaincode/go.mod ]; then
            cd blockchain/chaincode && go test ./...
          fi

      - name: Run Go vulnerability scan
        uses: golang/vulncheck-action@v1
        if: always()
        with:
          scan-path: ./blockchain/chaincode

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high || true

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run npm audit (backend)
        run: cd backend && npm audit --audit-level=high || true

      - name: Check for vulnerable dependencies
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const frontendAudit = fs.existsSync('frontend/audit-report.json') ? JSON.parse(fs.readFileSync('frontend/audit-report.json')) : null;
            const backendAudit = fs.existsSync('backend/audit-report.json') ? JSON.parse(fs.readFileSync('backend/audit-report.json')) : null;
            
            let hasHighVulns = false;
            if (frontendAudit && frontendAudit.metadata && frontendAudit.metadata.vulnerabilities && frontendAudit.metadata.vulnerabilities.high > 0) {
              console.log('Frontend HIGH vulnerabilities:', frontendAudit.metadata.vulnerabilities.high);
              hasHighVulns = true;
            }
            if (backendAudit && backendAudit.metadata && backendAudit.metadata.vulnerabilities && backendAudit.metadata.vulnerabilities.high > 0) {
              console.log('Backend HIGH vulnerabilities:', backendAudit.metadata.vulnerabilities.high);
              hasHighVulns = true;
            }
            
            if (hasHighVulns) {
              core.setFailed('High severity vulnerabilities found in dependencies');
            }

  docker-build:
    needs: [frontend, backend, chaincode, dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: tessera-frontend:latest
          load: true

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: tessera-backend:latest
          load: true

  deploy-staging:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging environment"
        # Add actual deployment steps here

  deploy-production:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        run: echo "Deploy to production environment"
        # Add actual deployment steps here